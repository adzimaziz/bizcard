<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040606">
<title>Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --gold-1: #fff3cf;
    --gold-2: #e2bd5a;
    --gold-3: #9a7420;
    --cyan: #5ef2d6;
    --ink: #eef3f1;
    --muted: #8fa29d;
    --bg: #040606;
  }
  * { box-sizing: border-box; }
  html {
    height: 100%;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(30,90,80,.35), transparent 60%),
      radial-gradient(700px 420px at 50% 115%, rgba(120,90,20,.28), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    background-repeat: no-repeat;
  }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: "Rajdhani", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4dvh, 32px);
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  /* faint moving grid behind everything */
  body::before {
    content: "";
    position: fixed; inset: -50%;
    background-image:
      linear-gradient(rgba(94,242,214,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,242,214,.045) 1px, transparent 1px);
    background-size: 36px 36px;
    transform: perspective(600px) rotateX(55deg);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 55%);
            mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 55%);
    animation: grid 18s linear infinite;
    pointer-events: none;
    z-index: -1;
  }
  @keyframes grid { to { background-position: 0 360px; } }

  /* ---------- Chamfer (cut corners) ----------
     --c = big cut (top-left & bottom-right), --s = small cut (top-right & bottom-left) */
  .chamfer {
    clip-path: polygon(
      var(--c) 0, calc(100% - var(--s)) 0, 100% var(--s), 100% calc(100% - var(--c)),
      calc(100% - var(--c)) 100%, var(--s) 100%, 0 calc(100% - var(--s)), 0 var(--c));
  }

  /* ---------- Card ---------- */
  .stage {
    perspective: 1200px; width: 100%; max-width: 440px;
    filter: drop-shadow(0 28px 40px rgba(0,0,0,.75)) drop-shadow(0 0 22px rgba(226,189,90,.14));
  }
  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 3.5 / 2;
    --tx: 0; --ty: 0;                     /* tilt, -1..1, set by gyroscope / finger */
    transform: rotateX(calc(var(--ty) * -16deg)) rotateY(calc(var(--tx) * 16deg));
    animation: enter 1.1s cubic-bezier(.2,.8,.2,1) backwards;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(24px) rotateX(18deg) scale(.96); }
    to   { opacity: 1; transform: none; }
  }
  /* The chamfered shape, gold edge, metal texture, shine and glare are all drawn in one SVG.
     clip-path, blend modes or composited layers inside a 3D-rotated element make Chrome
     rasterise the whole card at low resolution, which blurred the text when tilted. */
  .shape {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .face {
    position: relative;
    height: 100%;
  }

  /* ---------- Parallax layers ----------
     Each layer shifts by its depth --d as the card tilts, so the content reads as stacked sheets.
     Plain 2D offsets on purpose: see the note on .shape. */
  .layer {
    position: absolute; inset: 0;
    transform: translate(calc(var(--tx) * var(--d) * 7px), calc(var(--ty) * var(--d) * 7px));
    pointer-events: none;
  }
  .watermark {
    --d: -1;
    display: flex; align-items: flex-end; justify-content: flex-end;
    padding: 0 9% 5%;                     /* clear of the cut corner even at full tilt */
    font-family: "Orbitron", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(78px, 27vw, 124px);
    line-height: .8;
    letter-spacing: .02em;
    color: transparent;
    -webkit-text-stroke: 1px rgba(226,189,90,.16);
  }
  .frame-layer { --d: .45; }
  .content {
    --d: 1;
    transform: translate(calc(var(--tx) * var(--d) * 7px), calc(var(--ty) * var(--d) * 7px));
    /* shadow falls away from the tilt, so the text looks lifted off the card */
    --lift: calc(var(--tx) * -2.5px) calc(var(--ty) * -2.5px + 2px) 3px rgba(0,0,0,.75);
  }
  .role, .contacts { text-shadow: var(--lift); }
  .photo-wrap {
    --d: .9;                              /* on top of the content's own shift */
    flex: none;
    transform: translate(calc(var(--tx) * var(--d) * 7px), calc(var(--ty) * var(--d) * 7px));
  }
  .hint {
    position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 12px; letter-spacing: .25em; text-transform: uppercase;
    color: var(--muted);
    opacity: .8;
  }

  /* tech corner brackets */
  .corner { position: absolute; width: 14px; height: 14px; border: 1.5px solid var(--gold-2); opacity: .7; pointer-events: none; }
  .corner.tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; }
  .cham { position: absolute; width: 50px; height: 50px; fill: none; stroke: var(--gold-2); stroke-width: 1.5; opacity: .75; pointer-events: none; }
  .cham.tl { top: 0; left: 0; }
  .cham.br { bottom: 0; right: 0; transform: rotate(180deg); }

  .content {
    position: relative;
    height: 100%;
    padding: 6.5% 8% 7%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .gold {
    background: linear-gradient(100deg, var(--gold-3) 0%, var(--gold-1) 22%, var(--gold-2) 42%, var(--gold-1) 60%, var(--gold-3) 85%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: foil 6s linear infinite;
  }
  @keyframes foil { from { background-position: 0% 0; } to { background-position: 250% 0; } }

  .name {
    margin: 0;
    font-family: "Orbitron", "Rajdhani", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(15px, 4.6vw, 21px);
    line-height: 1.1;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .name small {
    display: block;
    margin-top: 2px;
    font-weight: 500;
    font-size: .62em;
    letter-spacing: .32em;
  }
  .role {
    margin-top: 7px;
    font-size: clamp(10px, 2.9vw, 13px);
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .company {
    margin-top: 1px;
    font-family: "Orbitron", "Rajdhani", system-ui, sans-serif;
    font-size: clamp(8.5px, 2.4vw, 10.5px);
    font-weight: 700;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(94,242,214,.45);
    margin-bottom: 6px;
  }
  .monogram {
    flex: none;
    width: clamp(38px, 10.5vw, 48px); aspect-ratio: 1;
    display: grid; place-items: center;
    clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%);
    background: linear-gradient(135deg, var(--gold-3), var(--gold-1) 45%, var(--gold-2) 70%, var(--gold-3));
    position: relative;
  }
  .monogram::before {
    content: "";
    position: absolute; inset: 1.5px;
    clip-path: inherit;
    background: #0a0d0c;
  }
  .monogram span {
    position: relative;
    font-family: "Orbitron", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(11px, 3.2vw, 14px);
    letter-spacing: .08em;
  }
  /* portrait in a gold chamfered frame (SVG, for the same reason as .shape) */
  .photo {
    display: block;
    width: clamp(60px, 18vw, 80px); height: auto; aspect-ratio: 1;
    overflow: visible;
  }
  .photo-shadow {
    transform: translate(calc(var(--tx) * -7px), calc(var(--ty) * -7px + 5px));
  }

  .rule {
    height: 1px;
    width: 42%;
    background: linear-gradient(90deg, var(--gold-2), rgba(94,242,214,.6) 60%, transparent);
    margin: 0 0 7px;
    position: relative;
  }
  .rule::after {
    content: "";
    position: absolute; top: -2px; left: 0;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse-dot 2.4s ease-in-out infinite;
  }
  @keyframes pulse-dot { 50% { opacity: .35; } }
  .tagline {
    font-size: clamp(10.5px, 3vw, 13.5px);
    font-weight: 500;
    letter-spacing: .04em;
    color: var(--muted);
    margin: 0 0 5px;
  }
  .contacts { list-style: none; margin: 0; padding: 0; font-size: clamp(11px, 3.2vw, 14px); font-weight: 600; letter-spacing: .04em; line-height: 1.4; }
  .contacts li { display: flex; align-items: center; gap: 9px; }
  .contacts svg { width: 1em; height: 1em; flex: none; stroke: var(--gold-2); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .contacts a { color: inherit; text-decoration: none; }

  /* ---------- Buttons ---------- */
  .actions {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 100%; max-width: 320px;
    animation: fade 1s ease 0.8s both;
  }
  .save, .wa {
    --c: 14px; --s: 0px;
    position: relative;
    isolation: isolate;
    width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    text-decoration: none;
    font: 700 15px/1 "Rajdhani", system-ui, sans-serif;
    letter-spacing: .22em;
    text-transform: uppercase;
    padding: 16px 22px;
    border: 0;
    background: rgba(226,189,90,.6);        /* shows through as the 1px outline */
    color: var(--gold-1);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .save::before {
    content: "";
    position: absolute; inset: 1px;
    --c: 13.6px;
    background: linear-gradient(rgba(226,189,90,.07), rgba(226,189,90,.07)), #0a0c0b;
    z-index: -1;
  }
  .wa {
    background: linear-gradient(100deg, var(--gold-3), var(--gold-1) 45%, var(--gold-2));
    color: #0a0d0c;
  }
  .wa::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.6) 50%, transparent 65%);
    background-size: 300% 100%;
    animation: btn-shine 3.2s ease-in-out 2s infinite;
    pointer-events: none;
    z-index: -1;                           /* behind the label */
  }
  .wa svg { width: 19px; height: 19px; fill: currentColor; flex: none; }
  @keyframes btn-shine {
    0%   { background-position: 100% 0; }
    50%  { background-position: 0% 0; }
    100% { background-position: 0% 0; }
  }
  .save:active, .wa:active { transform: scale(.97); }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* very narrow phones: drop the tagline so the contacts still fit */
  @media (max-width: 340px) {
    .tagline { display: none; }
    .content { padding-left: 10%; }
    .photo { width: 52px; }
    .name { font-size: 13.5px; }
    .role { font-size: 9.5px; letter-spacing: .1em; }
  }

  /* short screens (landscape phones) */
  @media (max-height: 520px) {
    body { flex-direction: row; gap: 20px; }
    .stage { max-width: min(440px, 58vw); }
    .actions { max-width: 260px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .gold, .actions, .wa::after, body::before, .rule::after { animation: none !important; }
    .card { transition: none; }
  }
  @media print {
    @page { size: 3.5in 2in; margin: 0; }
    html { background: none; }
    body { height: auto; overflow: visible; padding: 0; display: block; }
    body::before, .actions { display: none; }
    .stage { max-width: none; perspective: none; }
    .stage { filter: none; }
    .card { width: 3.5in; height: 2in; transform: none; animation: none; }
    .shape { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #shine, #glare { display: none; }
    .gold { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <article class="card" id="card">
      <svg class="shape" id="shape" aria-hidden="true">
        <defs>
          <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9a7420"/><stop offset=".25" stop-color="#fff3cf"/>
            <stop offset=".45" stop-color="#e2bd5a"/><stop offset=".6" stop-color="#5ef2d6"/>
            <stop offset=".8" stop-color="#fff3cf"/><stop offset="1" stop-color="#9a7420"/>
            <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="7s" repeatCount="indefinite"/>
          </linearGradient>
          <linearGradient id="faceGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#121716"/><stop offset=".55" stop-color="#070909"/><stop offset="1" stop-color="#0b0f0e"/>
          </linearGradient>
          <radialGradient id="warmGrad" cx="1" cy="0" r=".75">
            <stop offset="0" stop-color="#e2bd5a" stop-opacity=".16"/><stop offset="1" stop-color="#e2bd5a" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="coolGrad" cx="0" cy="1" r=".7">
            <stop offset="0" stop-color="#5ef2d6" stop-opacity=".09"/><stop offset="1" stop-color="#5ef2d6" stop-opacity="0"/>
          </radialGradient>
          <pattern id="brush" width="2" height="3" patternUnits="userSpaceOnUse">
            <rect width="1" height="3" fill="#fff" fill-opacity=".022"/><rect width="2" height="1" fill="#000" fill-opacity=".18"/>
          </pattern>
          <linearGradient id="shineGrad" x1="0" x2="1">
            <stop offset="0" stop-color="#fff6dc" stop-opacity="0"/><stop offset=".5" stop-color="#fff6dc" stop-opacity=".3"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="glareGrad">
            <stop offset="0" stop-color="#ffecb4" stop-opacity=".2"/><stop offset="1" stop-color="#ffecb4" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="faceClip"><polygon id="facePoly"/></clipPath>
        </defs>
        <polygon id="edgePoly" fill="url(#edgeGrad)"/>
        <g clip-path="url(#faceClip)">
          <rect width="100%" height="100%" fill="url(#faceGrad)"/>
          <rect width="100%" height="100%" fill="url(#warmGrad)"/>
          <rect width="100%" height="100%" fill="url(#coolGrad)"/>
          <rect width="100%" height="100%" fill="url(#brush)"/>
          <g id="shineRot"><rect id="shine" y="-50%" width="40%" height="200%" fill="url(#shineGrad)">
            <animate attributeName="x" values="-60%;130%;130%" keyTimes="0;.45;1" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
          </rect></g>
          <circle id="glare" r="45%" cx="50%" cy="50%" fill="url(#glareGrad)"/>
        </g>
      </svg>
      <div class="face">
        <div class="layer watermark" id="watermark" aria-hidden="true"></div>
        <div class="layer frame-layer" aria-hidden="true">
          <svg class="cham tl" viewBox="0 0 50 50"><path d="M10 46V27.3L27.3 10H46"/></svg>
          <svg class="cham br" viewBox="0 0 50 50"><path d="M10 46V27.3L27.3 10H46"/></svg>
          <i class="corner tr"></i><i class="corner bl"></i>
        </div>
        <div class="content">
          <div class="top">
            <div>
              <h1 class="name gold" id="name"></h1>
              <div class="role" id="role"></div>
              <div class="company" id="company"></div>
            </div>
            <div class="photo-wrap" id="photo">
              <svg class="photo" viewBox="0 0 100 100" role="img" id="photoSvg">
                <defs>
                  <linearGradient id="photoEdge" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#9a7420"/><stop offset=".4" stop-color="#fff3cf"/>
                    <stop offset=".65" stop-color="#e2bd5a"/><stop offset="1" stop-color="#5ef2d6"/>
                  </linearGradient>
                  <clipPath id="photoClip"><polygon id="photoInner"/></clipPath>
                  <filter id="photoBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
                </defs>
                <polygon class="photo-shadow" id="photoShadow" fill="#000" fill-opacity=".75" filter="url(#photoBlur)"/>
                <polygon id="photoOuter" fill="url(#photoEdge)"/>
                <image id="photoImg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
              </svg>
            </div>
            <div class="monogram" id="monogramBox"><span class="gold" id="monogram"></span></div>
          </div>
          <div>
            <div class="rule"></div>
            <p class="tagline" id="tagline"></p>
            <ul class="contacts" id="contacts"></ul>
          </div>
        </div>
      </div>
    </article>
  </div>

  <div class="actions">
 <a class="wa chamfer" id="wa" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>
      WhatsApp me now
    </a>
    <button class="save chamfer" id="save">Save contact</button>
  </div>
  <div class="hint" id="hint" hidden>Tap the card for 3D motion</div>

<script>
  const c = window.CARD;
  const fullName = [c.firstName, c.lastName].filter(Boolean).join(" ");
  const $ = (id) => document.getElementById(id);
  document.title = fullName;

  // First name on the main line, the rest ("Bin Ab Aziz") as a smaller second line
  $("name").textContent = c.firstName || "";
  if (c.lastName) {
    const small = document.createElement("small");
    small.textContent = c.lastName;
    $("name").append(small);
  }
  $("role").textContent = c.title || "";
  $("company").textContent = c.company || "";
  $("monogram").textContent = c.monogram || fullName.split(/\s+/).map((w) => w[0]).slice(0, 2).join("");
  // Show the photo when there is one, otherwise the monogram
  // Chamfer polygon: big cut c on top-left & bottom-right, small cut s on the other two corners
  const chamfer = (x, y, w, h, c, s) => [
    [x + c, y], [x + w - s, y], [x + w, y + s], [x + w, y + h - c],
    [x + w - c, y + h], [x + s, y + h], [x, y + h - s], [x, y + c],
  ].map((p) => p.join(",")).join(" ");
  // The same shape inset by d: the diagonal cuts shrink by d × (2 − √2) so the border stays even
  const inset = (w, h, c, s, d) => chamfer(d, d, w - 2 * d, h - 2 * d, c - d * (2 - Math.SQRT2), s - d * (2 - Math.SQRT2));

  if (c.photo) {
    $("photoImg").setAttribute("href", c.photo);
    $("photoSvg").setAttribute("aria-label", fullName);
    $("photoOuter").setAttribute("points", chamfer(0, 0, 100, 100, 18, 5));
    $("photoShadow").setAttribute("points", chamfer(0, 0, 100, 100, 18, 5));
    $("photoInner").setAttribute("points", inset(100, 100, 18, 5, 2.5));
    $("monogramBox").remove();
  } else {
    $("photo").remove();
  }
  $("tagline").textContent = c.tagline || "";
  if (!c.tagline) $("tagline").remove();

  const icons = {
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>',
    web: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
    in: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  };
  const strip = (u) => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  const rows = [
    ["phone", c.phone, c.phone && "tel:" + c.phone.replace(/[^+\d]/g, "")],
    ["mail", c.email, c.email && "mailto:" + c.email],
    ["web", c.website && strip(c.website), c.website],
    ["in", c.linkedin && strip(c.linkedin), c.linkedin],
    ["pin", c.address, null],
  ];
  for (const [icon, text, href] of rows) {
    if (!text) continue;
    const li = document.createElement("li");
    li.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[icon]}</svg>`;
    li.append(href ? Object.assign(document.createElement("a"), { href, textContent: text }) : document.createTextNode(text));
    $("contacts").append(li);
  }

  $("watermark").textContent = c.monogram || "";

  // Card outline follows its real size
  const card = $("card");
  const drawShape = () => {
    const w = card.offsetWidth, h = card.offsetHeight;
    $("edgePoly").setAttribute("points", chamfer(0, 0, w, h, 24, 8));
    $("facePoly").setAttribute("points", inset(w, h, 24, 8, 1.5));
    $("shineRot").setAttribute("transform", `rotate(20 ${w / 2} ${h / 2})`);
  };
  drawShape();
  new ResizeObserver(drawShape).observe(card);

  // 3D tilt: phone gyroscope, else finger / mouse, else a slow idle float
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) $("shape").pauseAnimations();
  if (!reduce) {
    const clamp = (v) => Math.max(-1, Math.min(1, v));
    let gyro = null, base = null, pointer = null;

    const onOrient = (e) => {
      if (e.beta == null || e.gamma == null) return;
      let b = e.beta, g = e.gamma;
      const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
      if (angle === 90) [b, g] = [-g, b];
      else if (angle === -90 || angle === 270) [b, g] = [g, -b];
      if (base === null) base = b;
      base += (b - base) * 0.004;          // slowly re-centre to however the phone is held
      gyro = { x: clamp(g / 22), y: clamp((b - base) / 22) };
    };

    // iOS asks for permission, and only after a tap
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      $("hint").hidden = false;
      document.addEventListener("click", () => {
        DeviceOrientationEvent.requestPermission()
          .then((state) => { if (state === "granted") addEventListener("deviceorientation", onOrient); })
          .catch(() => {})
          .finally(() => ($("hint").hidden = true));
      }, { once: true });
    } else {
      addEventListener("deviceorientation", onOrient);
    }

    const fromPoint = (x, y) => {
      const r = card.getBoundingClientRect();
      pointer = { x: clamp(((x - r.left) / r.width - 0.5) * 2), y: clamp(((y - r.top) / r.height - 0.5) * 2) };
    };
    card.addEventListener("pointermove", (e) => fromPoint(e.clientX, e.clientY));
    card.addEventListener("pointerleave", () => (pointer = null));
    card.addEventListener("touchmove", (e) => fromPoint(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    card.addEventListener("touchend", () => (pointer = null));

    let x = 0, y = 0;
    const tick = (t) => {
      const target = pointer || gyro || { x: Math.sin(t / 1700) * 0.35, y: Math.cos(t / 2300) * 0.25 };
      x += (target.x - x) * 0.09;
      y += (target.y - y) * 0.09;
      card.style.setProperty("--tx", x.toFixed(4));
      card.style.setProperty("--ty", y.toFixed(4));
      $("glare").setAttribute("cx", 50 + x * 45 + "%");
      $("glare").setAttribute("cy", 50 + y * 45 + "%");
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  const waNumber = (c.whatsapp ?? c.phone ?? "").replace(/\D/g, "");
  if (waNumber) {
    $("wa").href = `https://wa.me/${waNumber}` + (c.whatsappMessage ? `?text=${encodeURIComponent(c.whatsappMessage)}` : "");
  } else {
    $("wa").remove();
  }

  // vCard 3.0 for "Save contact" — saved under the short contact name
  const savedName = c.contactName || fullName;
  const [savedFirst, ...savedRest] = savedName.split(/\s+/);
  const esc = (v) => String(v).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${esc(savedRest.join(" "))};${esc(savedFirst)};;;`,
    `FN:${esc(savedName)}`,
    c.company && `ORG:${esc(c.company)}`,
    c.title && `TITLE:${esc(c.title)}`,
    c.phone && `TEL;TYPE=CELL:${c.phone}`,
    c.email && `EMAIL;TYPE=INTERNET:${c.email}`,
    c.website && `URL:${c.website}`,
    c.linkedin && `URL:${c.linkedin}`,
    c.address && `ADR;TYPE=WORK:;;${esc(c.address)};;;;`,
    "END:VCARD",
  ].filter(Boolean).join("\r\n");

  $("save").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([vcard], { type: "text/vcard" }));
    a.download = savedName.toLowerCase().replace(/\s+/g, "-") + ".vcf";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
</script>
</body>
</html>
